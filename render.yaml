services:
  # -------------------------------------------------------------------------
  # Multimodal Attendance & Engagement Agent - FastAPI Backend Service
  # -------------------------------------------------------------------------
  - type: web
    name: multimodal-attendance-agent-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: AUTO_SEED_DEMO_DATA
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./attendance_agent.db
